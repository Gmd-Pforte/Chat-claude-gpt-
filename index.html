<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PS Cartoon Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: Studio-Raster – Kopfzeile, Bibliothek | Bühne | Eigenschaften, Zeitleiste unten. Ein dunkler Studio-Look. */
:root{
  --ink:#13111a; --panel:#1b1824; --panel2:#24202f; --line:#332e42; --text:#ede9f5; --mute:#9e97b0;
  --accent:#ff8a3d; --accent2:#4fd1c5; --sel:#ffd166; --danger:#ff5d6c; --stagebg:#0b0a10;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --lw:120px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font:14px/1.4 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
#app{display:grid;height:100%;grid-template-columns:250px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr) 240px;
  grid-template-areas:"top top top" "left stage right" "tl tl tl";
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{grid-area:top;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;scrollbar-width:none}
header::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;flex:none;margin-right:4px}
.logo{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#1d1208;display:grid;place-items:center;font:700 15px var(--display);
  border:3px solid #2a1d14;box-shadow:2px 2px 0 #2a1d14}
.bname{font:600 18px var(--display);letter-spacing:.2px;white-space:nowrap}
#projName{width:180px;min-width:120px;height:34px;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:0 10px;flex:none}
.hgroup{display:flex;gap:6px;margin-left:auto;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;flex:none}
.btn:hover{border-color:#4d4660}
.btn:focus-visible,.tab:focus-visible,.libbtn:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.btn.primary{background:var(--accent);color:#1d1208;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.ico{width:36px;padding:0;font-size:17px}
.btn:disabled{opacity:.38;cursor:default}
.btn.small{height:30px;font-size:12.5px;padding:0 10px}
.mob{display:none!important}
.panel{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
#left{grid-area:left;border-right:1px solid var(--line)}
#right{grid-area:right;border-left:1px solid var(--line)}
.sheethead{align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);font:600 16px var(--display)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.tab{flex:1 0 auto;padding:7px 8px;border-radius:7px;border:1px solid transparent;background:none;color:var(--mute);font-weight:600;font-size:12.5px;cursor:pointer}
.tab.on{background:var(--panel2);color:var(--text);border-color:var(--line)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.pbody h4{margin:14px 0 8px;font:600 14px var(--display);color:var(--text);letter-spacing:.2px}
.pbody h4:first-child{margin-top:0}
.hint{color:var(--mute);font-size:12.5px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.libbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:58px;padding:8px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;font-size:12.5px;text-align:center}
.libbtn:hover:not(:disabled){border-color:var(--accent)}
.libbtn:disabled{opacity:.4;cursor:default}
.libbtn canvas{width:100%;border-radius:6px;display:block}
.libbtn .sw{width:14px;height:14px;border-radius:4px;display:inline-block;border:2px solid #231c2a}
.libbtn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;min-width:0}
.item.on{border-color:var(--accent)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.item .meta{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#stageWrap{grid-area:stage;position:relative;background:var(--stagebg);min-width:0;min-height:0}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#stageHint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--mute);background:rgba(11,10,16,.75);padding:4px 9px;border-radius:7px;pointer-events:none}
#timeline{grid-area:tl;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#transport{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
#transport::-webkit-scrollbar{display:none}
#bPlay{min-width:112px}
#tcode{font:600 13px var(--body);font-variant-numeric:tabular-nums;color:var(--text);padding:0 6px;white-space:nowrap}
.tsep{width:1px;height:22px;background:var(--line);flex:none;margin:0 4px}
.tfield{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);white-space:nowrap;flex:none}
.tfield input[type=number]{width:62px;height:30px;background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:0 6px}
.tfield input[type=range]{width:90px;accent-color:var(--accent)}
#tlScroll{flex:1;overflow:auto;position:relative;min-height:0}
#tlInner{position:relative;min-width:100%}
.trow{display:flex;height:38px;border-bottom:1px solid rgba(255,255,255,.04)}
.trow.ruler{height:26px;position:sticky;top:0;z-index:5;background:var(--panel)}
.tlabel{position:sticky;left:0;z-index:4;width:var(--lw);flex:none;background:var(--panel2);border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;
  padding:0 8px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tlabel.on{color:var(--sel)}
.tlabel .dot{width:9px;height:9px;border-radius:50%;flex:none}
.lane{position:relative;flex:none;cursor:pointer}
.ruler .lane{cursor:ew-resize}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--mute);padding:5px 0 0 4px;font-variant-numeric:tabular-nums;pointer-events:none}
.tick.minor{top:16px;border-color:rgba(255,255,255,.06)}
.clip{position:absolute;top:5px;bottom:5px;border-radius:7px;border:2px solid #231c2a;color:#16121c;font-size:12px;font-weight:700;display:flex;align-items:center;
  padding:0 16px 0 7px;white-space:nowrap;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.clip.sel{box-shadow:0 0 0 2px var(--sel)}
.clip .rz{position:absolute;right:0;top:0;bottom:0;width:13px;cursor:ew-resize;background:rgba(0,0,0,.16)}
.clip .kf{position:absolute;right:15px;top:50%;width:9px;height:9px;background:#16121c;transform:translateY(-50%) rotate(45deg)}
.clip.audio{background:#2a5d63;color:var(--text);padding-left:6px}
.clip.audio canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:.85}
.clip.audio span{position:relative;text-shadow:0 1px 2px #000}
#playhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);z-index:3;pointer-events:none}
#playhead::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid var(--accent)}
.endzone{position:absolute;top:0;bottom:0;right:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(45deg,rgba(0,0,0,.28) 0 6px,rgba(0,0,0,.4) 6px 12px)}
.tlempty{padding:14px;color:var(--mute);font-size:13px}
.ctl{display:block;margin-bottom:11px}
.ctl-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mute);margin-bottom:3px}
.ctl-top .val{color:var(--text);font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0}
.ctl select,.ctl input[type=text],.ctl input[type=number]{width:100%;height:34px;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:0 8px}
.ctl.inline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ctl.inline .ctl-top{margin:0}
.ctl input[type=color]{width:46px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--ink);padding:2px;cursor:pointer}
.ctl input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
details.grp{border:1px solid var(--line);border-radius:10px;padding:8px 10px 2px;margin-bottom:10px;background:rgba(255,255,255,.015)}
details.grp summary{font:600 14px var(--display);cursor:pointer;margin-bottom:8px;list-style-position:inside}
.ptitle{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ptitle b{font:600 17px var(--display)}
.chip{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.menu{position:fixed;z-index:60;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:5px;min-width:200px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;background:none;border:0;border-radius:7px;font-weight:500;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:rgba(255,255,255,.07);outline:none}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
#modalWrap{position:fixed;inset:0;background:rgba(5,4,10,.62);display:grid;place-items:center;z-index:70;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(470px,100%);max-height:82vh;overflow:auto;padding:18px}
.modal h3{margin:0 0 10px;font:600 19px var(--display)}
.modal p{color:var(--mute);margin:0 0 12px}
#mBtns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.bar{height:8px;background:var(--ink);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:#2c2739;border:1px solid var(--line);padding:9px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.45);font-weight:500;transition:opacity .3s}
@media (min-width:821px) and (max-width:1120px){#app{grid-template-columns:215px minmax(0,1fr) 255px}}
@media (max-width:820px){
  :root{--lw:84px}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(150px,1fr);grid-template-areas:"top" "stage" "tl"}
  #stageWrap{aspect-ratio:16/9;max-height:56vh}
  #projName{display:none}
  .hgroup{margin-left:auto}
  .hgroup .mob{order:-1}
  header{gap:6px;padding-left:8px;padding-right:8px}
  .hgroup .btn{padding:0 10px}
  #left,#right{position:fixed;left:0;right:0;bottom:0;height:66vh;z-index:40;border:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -12px 40px rgba(0,0,0,.55);padding-bottom:env(safe-area-inset-bottom,0px)}
  #left.open,#right.open{transform:none}
  .mob{display:inline-flex!important}
  .sheethead.mob{display:flex!important}
  .bname,.hideMob{display:none}
  #stageHint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="logo">PS</span><span class="bname">Cartoon Studio</span></div>
    <input id="projName" type="text" aria-label="Projektname" title="Projektname">
    <div class="hgroup">
      <button class="btn ico" id="bUndo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig">↶</button>
      <button class="btn ico" id="bRedo" title="Wiederholen (Strg+Y)" aria-label="Wiederholen">↷</button>
      <button class="btn" id="bSave" title="Projekt im Browser speichern">Speichern</button>
      <button class="btn" id="bOpen" title="Gespeicherte Projekte öffnen">Öffnen</button>
      <button class="btn" id="bExport" title="Export, Import, Video">Datei ▾</button>
      <button class="btn mob" id="bLib">Bibliothek</button>
      <button class="btn mob" id="bProps">Eigenschaften</button>
    </div>
  </header>

  <aside id="left" class="panel" aria-label="Bibliothek">
    <div class="sheethead mob"><span>Bibliothek</span><button class="btn ico" data-close="left" aria-label="Schließen">✕</button></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="pbody" id="leftBody"></div>
  </aside>

  <main id="stageWrap">
    <canvas id="stage" aria-label="Animationsbühne"></canvas>
    <div id="stageHint">Figuren ziehen · Rechtsklick oder lange drücken für Menü · Leertaste = Abspielen</div>
  </main>

  <aside id="right" class="panel" aria-label="Eigenschaften">
    <div class="sheethead mob"><span>Eigenschaften</span><button class="btn ico" data-close="right" aria-label="Schließen">✕</button></div>
    <div class="pbody" id="props"></div>
  </aside>

  <section id="timeline" aria-label="Zeitleiste">
    <div id="transport">
      <button class="btn ico" id="tStart" title="Zum Anfang" aria-label="Zum Anfang">⏮</button>
      <button class="btn ico" id="tBack" title="1 Sekunde zurück" aria-label="1 Sekunde zurück">−1</button>
      <button class="btn primary" id="bPlay" title="Abspielen / Pause (Leertaste)">▶ Abspielen</button>
      <button class="btn ico" id="tFwd" title="1 Sekunde vor" aria-label="1 Sekunde vor">+1</button>
      <button class="btn ico" id="tEnd" title="Zum Ende" aria-label="Zum Ende">⏭</button>
      <span id="tcode">00:00,0</span>
      <span class="tsep"></span>
      <label class="tfield" title="Länge der aktuellen Szene in Sekunden">Szene <input type="number" id="tDur" min="1" max="3600" step="0.5"> s</label>
      <label class="tfield" title="Beim Abspielen alle Szenen nacheinander zeigen"><input type="checkbox" id="tFilm"> Ganzer Film</label>
      <label class="tfield hideMob" title="Zeitleiste vergrößern">Zoom <input type="range" id="tZoom" min="20" max="200" step="5"></label>
    </div>
    <div id="tlScroll"><div id="tlInner"></div></div>
  </section>
</div>

<div id="menu" class="menu" hidden></div>
<div id="modalWrap" hidden><div class="modal" role="dialog" aria-modal="true"><h3 id="mTitle"></h3><div id="mBody"></div><div id="mBtns"></div></div></div>
<div id="toasts"></div>
<input type="file" id="fAudio" accept="audio/*,.mp3,.wav" hidden>
<input type="file" id="fImage" accept="image/*" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>

<script>
'use strict';
/* =====================================================================
   PS Cartoon Studio 1.0
   Aufbau:
   1. Grundlagen & Hilfsfunktionen
   2. Rig, Posen & Animationen (Keyframes + Catmull-Rom-Interpolation)
   3. Zeichnen: Figuren, Gegenstände, Hintergründe
   4. Projektmodell, Beispielprojekt, Rückgängig
   5. Audio (Import, Analyse, Wiedergabe, Mundbewegung)
   6. Bühne (Rendering, Ziehen, Kontextmenü)
   7. Zeitleiste
   8. Panels (Bibliothek, Eigenschaften)
   9. Speichern (IndexedDB), Export (JSON, PNG, Video)
   ===================================================================== */

// ---------- 1. Grundlagen ----------
const W = 1280, H = 720, TAU = Math.PI * 2, DEG = Math.PI / 180, OUT = '#231c2a', ENV_RATE = 60;
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = u => u * u * (3 - 2 * u);
const deep = o => JSON.parse(JSON.stringify(o));
const snap = v => Math.round(v * 20) / 20;
const isMobile = () => window.innerWidth <= 820;
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function hashId(id) { let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) % 9973; return h; }
function shade(hex, a) {
  const n = parseInt((hex || '#888888').slice(1), 16); const r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = v => clamp(Math.round(a < 0 ? v * (1 + a) : v + (255 - v) * a), 0, 255).toString(16).padStart(2, '0');
  return '#' + f(r) + f(g) + f(b);
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fmtT(t) { t = Math.max(0, t); const m = Math.floor(t / 60); const s = (t - m * 60).toFixed(1); return String(m).padStart(2, '0') + ':' + s.padStart(4, '0').replace('.', ','); }
function rr(c, x, y, w, h, r) { r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function fs(c, fill) { c.fillStyle = fill; c.fill(); c.stroke(); }
function limb(c, len, w1, w2, fill) {
  c.beginPath(); c.moveTo(-w1 / 2, 0); c.lineTo(-w2 / 2, len); c.arc(0, len, w2 / 2, Math.PI, 0, true);
  c.lineTo(w1 / 2, 0); c.arc(0, 0, w1 / 2, 0, Math.PI, true); c.closePath(); fs(c, fill);
}

// ---------- 2. Rig, Posen & Animationen ----------
// Winkel in Grad. Arme/Beine: 0 = hängt gerade nach unten, positiv = nach vorne (Blickrichtung).
// Ellbogen: positiv = Unterarm knickt nach vorne. Knie: positiv = Unterschenkel knickt nach hinten.
// Fuß: absoluter Winkel, positiv = Zehen hoch. Kopf/Oberkörper: positiv = nach vorne geneigt.
const NEUTRAL = { torso: 0, head: 0, look: 0, armF: 6, elbowF: 12, handF: 0, armB: -6, elbowB: 12, handB: 0,
  legF: 4, kneeF: 2, footF: 0, legB: -4, kneeB: 2, footB: 0, hipDrop: 0, bob: 0, jump: 0, shiftX: 0,
  mouth: 0, mw: 1, gaze: 0.6, smile: 0.3, brow: 0, sad: 0, eyes: 1, tears: 0, pointF: 0, blush: 0 };

// Keyframe-Abtastung mit Catmull-Rom (flüssige Bewegung ohne Ruckeln an den Schlüsselbildern)
function sampleKeys(keys, t, loop) {
  const n = keys.length; if (n === 1) return keys[0][1];
  if (loop) t = ((t % 1) + 1) % 1;
  else { if (t <= keys[0][0]) return keys[0][1]; if (t >= keys[n - 1][0]) return keys[n - 1][1]; }
  let i = 0; while (i < n - 2 && t > keys[i + 1][0]) i++;
  const k1 = keys[i], k2 = keys[i + 1], span = k2[0] - k1[0];
  const u = span > 0 ? clamp((t - k1[0]) / span, 0, 1) : 0;
  let p0, p3;
  if (loop) { p0 = i > 0 ? keys[i - 1][1] : keys[n - 2][1]; p3 = i + 2 < n ? keys[i + 2][1] : keys[1][1]; }
  else { p0 = i > 0 ? keys[i - 1][1] : k1[1]; p3 = i + 2 < n ? keys[i + 2][1] : k2[1]; }
  const p1 = k1[1], p2 = k2[1], u2 = u * u, u3 = u2 * u;
  return 0.5 * (2 * p1 + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 + (-p0 + 3 * p1 - 3 * p2 + p3) * u3);
}
const C = v => [[0, v], [1, v]]; // konstanter Wert (für Schleifen)

    if (inten !== 1) for (const k in tgt) { const n = NEUTRAL[k]; if (n !== undefined) tgt[k] = n + (tgt[k] - n) * inten; }

}

  const SR = 48000, total = Math.ceil(scenes.reduce((s, x) => s + x.duration, 0) * SR), L = new Float32Array(total), Rr = new Float32Array(total);
  let pos = 0, any = false;
  for (const sc of scenes) {
    const len = Math.max(1, Math.ceil(sc.duration * SR)), clips = sc.audio.filter(a => audioCache[a.asset]);
    if (clips.length) {
      any = true; const oc = new OfflineAudioContext(2, len, SR);
      for (const a of clips) { const src = oc.createBufferSource(); src.buffer = audioCache[a.asset].buffer; const g = oc.createGain(); g.gain.value = a.volume ?? 1; src.connect(g); g.connect(oc.destination); src.start(Math.max(0, a.start)); }
      const buf = await oc.startRendering(), l = buf.getChannelData(0), r = buf.numberOfChannels > 1 ? buf.getChannelData(1) : l;
      L.set(l.subarray(0, Math.min(len, total - pos)), pos); Rr.set(r.subarray(0, Math.min(len, total - pos)), pos);
    }
    pos += len; if (pos >= total) break;
  }
  return any ? { L, R: Rr, SR } : null;
}

async function exportMP4File(scenes, onProgress, isCancelled) {
  const FPS = 30, vcfg = await MP4.pickVideoConfig(W, H, FPS); if (!vcfg) return null;
  const mix = await mixAudio(scenes); let acfg = null;
  if (mix) { acfg = await MP4.pickAudioConfig(); if (!acfg) return null; }
  let err = null;
  // Audio kodieren
  let audio = null;
  if (mix) {
    const chunks = [], durs = []; let asc = null;
    const aenc = new AudioEncoder({ output: (ch, meta) => { if (!asc && meta && meta.decoderConfig && meta.decoderConfig.description) asc = MP4.bytes(meta.decoderConfig.description); const b = new Uint8Array(ch.byteLength); ch.copyTo(b); chunks.push(b); durs.push(Math.round((ch.duration || 0) * mix.SR / 1e6) || (acfg.codec === 'opus' ? 960 : 1024)); }, error: e => err = e });
    aenc.configure(acfg);
    const N = 4800;
    for (let i = 0; i < mix.L.length; i += N) {
      const n = Math.min(N, mix.L.length - i), data = new Float32Array(n * 2); data.set(mix.L.subarray(i, i + n), 0); data.set(mix.R.subarray(i, i + n), n);
      const ad = new AudioData({ format: 'f32-planar', sampleRate: mix.SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i / mix.SR * 1e6), data });
      aenc.encode(ad); ad.close();
      if (aenc.encodeQueueSize > 20) await new Promise(r => setTimeout(r, 0));
      if (isCancelled()) { aenc.close(); return 'cancel'; }
    }
    await aenc.flush(); aenc.close(); if (err) throw err;
    audio = { chunks, durs, sr: mix.SR, ch: 2, codec: acfg.codec === 'opus' ? 'opus' : 'aac', asc: asc || new Uint8Array([0x11, 0x90]) };
  }
  // Video Bild für Bild
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  const vChunks = [], keys = []; let avcC = null;
  const venc = new VideoEncoder({ output: (ch, meta) => { if (!avcC && meta && meta.decoderConfig && meta.decoderConfig.description) avcC = MP4.bytes(meta.decoderConfig.description); const b = new Uint8Array(ch.byteLength); ch.copyTo(b); vChunks.push(b); keys.push(ch.type === 'key'); }, error: e => err = e });
  venc.configure(vcfg);
  const totalFrames = scenes.reduce((s, x) => s + Math.round(x.duration * FPS), 0); let gi = 0;
  for (const sc of scenes) {
    const nF = Math.round(sc.duration * FPS);
    for (let i = 0; i < nF; i++, gi++) {
      ctx.setTransform(1, 0, 0, 1, 0, 0); renderScene(ctx, sc, i / FPS, true);
      const vf = new VideoFrame(cv, { timestamp: Math.round(gi * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      venc.encode(vf, { keyFrame: gi % (FPS * 2) === 0 }); vf.close();
      while (venc.encodeQueueSize > 4) await new Promise(r => setTimeout(r, 1));
      if (gi % 15 === 0) { onProgress(gi / totalFrames); await new Promise(r => setTimeout(r, 0)); }
      if (err) throw err;
      if (isCancelled()) { venc.close(); return 'cancel'; }
    }
  }
  await venc.flush(); venc.close(); if (err) throw err;
  if (!avcC) throw new Error('Kein H.264-Header vom Encoder');
  onProgress(1);
  return MP4.build({ chunks: vChunks, keys, fps: FPS, w: W, h: H, avcC }, audio);
}

async function exportVideo() {
  pause();
  const scenes = ui.film ? project.scenes.slice() : [scene()];
  const total = scenes.reduce((s, x) => s + x.duration, 0);
  const vOK = await MP4.pickVideoConfig(W, H, 30);
  if (!vOK) { exportVideoRealtime(); return; }
  let cancelled = false;
  const body = el('div'); body.append(el('p', '', 'Das Video wird Bild für Bild berechnet (' + fmtT(total) + ', 30 Bilder pro Sekunde). Lass diese Seite geöffnet.'));
  const bar = el('div', 'bar'); bar.append(el('i')); body.append(bar); const info = el('p', 'hint', 'Format: MP4 · 0 %'); body.append(info);
  showModal('Video wird erstellt', body, [{ label: 'Abbrechen', danger: true, keep: true, fn: () => { cancelled = true; } }]);
  const t0 = performance.now();
  try {
    const res = await exportMP4File(scenes, f => { bar.firstChild.style.width = (f * 100).toFixed(1) + '%'; const el2 = (performance.now() - t0) / 1000, rest = f > 0.02 ? el2 / f - el2 : 0; info.textContent = 'Format: MP4 · ' + Math.round(f * 100) + ' %' + (rest ? ' · noch ca. ' + fmtT(rest).slice(0, 5) + ' min' : ''); }, () => cancelled);
    closeModal();
    if (res === 'cancel') { toast('Video abgebrochen'); return; }
    if (!res) { toast('MP4 nicht möglich – nehme stattdessen in Echtzeit auf'); exportVideoRealtime(); return; }
    download(res, fileBase() + '.mp4'); toast('Video fertig (MP4, ' + (res.size / 1048576).toFixed(1) + ' MB) – wird heruntergeladen');
  } catch (e) { console.error(e); closeModal(); toast('MP4-Erstellung fehlgeschlagen – nehme stattdessen in Echtzeit auf'); exportVideoRealtime(); }
}

function updateRecProgress() {
  if (!recording) return; let done = time; for (let i = recording.startScene; i < project.active; i++) done += project.scenes[i].duration;
  const b = document.querySelector('#mBody .bar i'); if (b) b.style.width = clamp(done / recording.total * 100, 0, 100) + '%';
}
function finishRecording() { if (!recording) return; const r = recording.rec; setTimeout(() => { try { r.stop(); } catch (e) {} }, 350); }

// ---------- Bedienung verdrahten ----------
$('#bUndo').addEventListener('click', undo); $('#bRedo').addEventListener('click', redo);
$('#bSave').addEventListener('click', saveProject); $('#bOpen').addEventListener('click', openDialog);
$('#projName').addEventListener('change', e => { project.name = e.target.value.trim() || 'Projekt'; commit(); });
$('#bExport').addEventListener('click', e => {
  if (!menuEl.hidden) { hideMenu(); return; }
  const r = e.currentTarget.getBoundingClientRect();
  showMenu(r.left, r.bottom + 6, [{ label: 'Projekt als JSON speichern', fn: exportJSON }, { label: 'JSON-Projekt öffnen …', fn: () => $('#fJson').click() }, '-',
    { label: 'Aktuelles Bild als PNG', fn: exportPNG }, { label: ui.film ? 'Ganzen Film als Video aufnehmen' : 'Szene als Video aufnehmen', fn: exportVideo }, '-',
    { label: 'Beispielprojekt laden', fn: () => showModal('Beispielprojekt laden?', 'Das aktuelle Projekt wird ersetzt. Speichere es vorher, wenn du es behalten möchtest.', [{ label: 'Abbrechen' }, { label: 'Beispiel laden', primary: true, fn: () => loadData(exampleProject()) }]) },
    { label: 'Neues leeres Projekt', fn: () => showModal('Neues Projekt anlegen?', 'Das aktuelle Projekt wird ersetzt. Speichere es vorher, wenn du es behalten möchtest.', [{ label: 'Abbrechen' }, { label: 'Neu anlegen', primary: true, fn: () => loadData(blankProject()) }]) }]);
});
$('#fAudio').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importAudioFile(f); });
$('#fImage').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const data = await fileToDataURL(f); const id = uid(); assets[id] = { type: 'image', name: f.name.replace(/\.[^.]+$/, ''), data }; scene().bg = { type: 'image', asset: id }; commit(); renderAll(); toast('Hintergrundbild gesetzt'); }
  catch (err) { toast('Das Bild konnte nicht gelesen werden.'); }
});
$('#fJson').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const data = JSON.parse(await f.text()); await loadData(data); toast('Projekt „' + project.name + '“ geladen'); }
  catch (err) { console.error(err); toast('Diese Datei ist kein gültiges PS-Cartoon-Studio-Projekt.'); }
});
$('#bPlay').addEventListener('click', () => playing ? pause() : play());
$('#tStart').addEventListener('click', () => setTime(0)); $('#tEnd').addEventListener('click', () => setTime(scene().duration));
$('#tBack').addEventListener('click', () => setTime(time - 1)); $('#tFwd').addEventListener('click', () => setTime(time + 1));
$('#tDur').addEventListener('change', e => { const v = clamp(+e.target.value || 1, 1, 3600); scene().duration = v; time = Math.min(time, v); commit(); renderTimeline(); renderProps(); requestRender(); });
$('#tFilm').addEventListener('change', e => { ui.film = e.target.checked; });
$('#tZoom').addEventListener('input', e => { ui.pps = +e.target.value; renderTimeline(); });
function closeSheets() { $('#left').classList.remove('open'); $('#right').classList.remove('open'); }
$('#bLib').addEventListener('click', () => { $('#right').classList.remove('open'); $('#left').classList.toggle('open'); });
$('#bProps').addEventListener('click', () => { $('#left').classList.remove('open'); $('#right').classList.toggle('open'); });
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheets));
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (e.key === 'Escape') { hideMenu(); if (!recording) closeModal(); return; }
  if (!$('#modalWrap').hidden) return;
  if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') {
    if (!sel) return; e.preventDefault();
    if (sel.kind === 'clip') delClip(sel.id); else if (sel.kind === 'audio') delAudio(sel.id);
    else if (sel.kind === 'prop') { const p = findProp(sel.id); if (p) delProp(p); } else if (sel.kind === 'actor') { const a = findActor(sel.id); if (a) delActor(a); }
  } else if (e.key === 'ArrowLeft') setTime(time - (e.shiftKey ? 1 : 0.1));
  else if (e.key === 'ArrowRight') setTime(time + (e.shiftKey ? 1 : 0.1));
});
new ResizeObserver(() => { drawStage(); }).observe($('#stageWrap'));
let lastW = window.innerWidth; window.addEventListener('resize', () => { if (project && Math.abs(window.innerWidth - lastW) > 40) { lastW = window.innerWidth; renderTimeline(); } });

// ---------- Start ----------
(async function boot() {
  let data = null;
  try { const rec = await dbGet(AUTO); if (rec && rec.data) data = rec.data; } catch (e) { console.warn('Kein lokaler Speicher', e); }
  try { await loadData(data || exampleProject()); if (data) toast('Letzter Stand wiederhergestellt'); }
  catch (e) { console.error(e); await loadData(exampleProject()); }
})();
</script>
